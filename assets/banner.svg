<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="340">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d18" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="purple-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>

    <filter id="blur-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" />
    </filter>

    <style>
      .title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 42px;
        letter-spacing: -0.5px;
      }
      .subtitle {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
        font-size: 19px;
        fill: #94a3b8;
      }
      .tag {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 12px;
        letter-spacing: 0.5px;
      }
      .pulse-circle {
        animation: pulse 4s ease-in-out infinite alternate;
      }
      .drift-flow {
        animation: floatFlow 8s linear infinite;
      }
      .drift-flow-rev {
        animation: floatFlowRev 10s linear infinite;
      }
      @keyframes pulse {
        0% { transform: scale(0.95); opacity: 0.4; }
        100% { transform: scale(1.08); opacity: 0.8; }
      }
      @keyframes floatFlow {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -200; }
      }
      @keyframes floatFlowRev {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: 200; }
      }
      .badge-bg {
        fill: rgba(30, 41, 59, 0.85);
        stroke: rgba(148, 163, 184, 0.25);
        stroke-width: 1px;
      }
    </style>
  </defs>

  <!-- Background Layer -->
  <rect width="100%" height="100%" fill="url(#bg-grad)" rx="16"/>
  <rect width="100%" height="100%" fill="url(#grid)" rx="16"/>

  <!-- Dynamic / Animated Background Glows -->
  <g opacity="0.6">
    <circle cx="200" cy="100" r="140" fill="url(#cyan-glow)" filter="url(#blur-filter)" class="pulse-circle"/>
    <circle cx="1000" cy="240" r="160" fill="url(#purple-glow)" filter="url(#blur-filter)" class="pulse-circle" style="animation-delay: -2s;"/>
  </g>

  <!-- Dynamic / Animated Data Flow Streams in Background -->
  <g fill="none" stroke-width="2">
    <path d="M 50 280 C 300 280, 450 60, 700 60 C 950 60, 1050 280, 1150 280" stroke="rgba(56, 189, 248, 0.2)" stroke-dasharray="8 8" class="drift-flow"/>
    <path d="M 50 60 C 250 60, 400 300, 650 300 C 900 300, 1000 120, 1150 120" stroke="rgba(192, 132, 252, 0.2)" stroke-dasharray="10 10" class="drift-flow-rev"/>
  </g>

  <!-- Animated Particles/Nodes in Background -->
  <g fill="#38bdf8" opacity="0.5">
    <circle cx="280" cy="180" r="3"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="920" cy="150" r="4"><animate attributeName="opacity" values="0.3;1;0.3" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="750" cy="240" r="2.5"><animate attributeName="opacity" values="0.2;0.7;0.2" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="450" cy="90" r="3.5"><animate attributeName="opacity" values="0.4;0.9;0.4" dur="3.5s" repeatCount="indefinite"/></circle>
  </g>

  <!-- FOREGROUND: Content is fully clear, high-contrast, and never obscured -->
  <g transform="translate(60, 0)">
    <!-- Decorative Category Pill -->
    <g transform="translate(0, 50)">
      <rect width="280" height="30" rx="15" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1"/>
      <circle cx="16" cy="15" r="5" fill="#38bdf8"/>
      <text x="30" y="20" fill="#38bdf8" class="tag">DEV ENVIRONMENT PROVISIONING</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="132" class="title" fill="url(#text-grad)">Awesome Development Environment</text>
    <text x="0" y="180" class="title" fill="url(#text-grad)">Provisioning &amp; Inner-Loops</text>

    <!-- Subtitle -->
    <text x="0" y="222" class="subtitle">Curated tools for Reproducible Local Stacks, Kubernetes Loops, CDEs &amp; Environment-as-Code</text>

    <!-- Feature Tags Row -->
    <g transform="translate(0, 254)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="130" height="34" rx="8" class="badge-bg"/>
        <text x="65" y="21" fill="#e2e8f0" text-anchor="middle" class="tag">🐳 Containers</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(142, 0)">
        <rect width="140" height="34" rx="8" class="badge-bg"/>
        <text x="70" y="21" fill="#e2e8f0" text-anchor="middle" class="tag">☸️ Kubernetes</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(294, 0)">
        <rect width="165" height="34" rx="8" class="badge-bg"/>
        <text x="82" y="21" fill="#e2e8f0" text-anchor="middle" class="tag">☁️ Cloud Dev Envs</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(471, 0)">
        <rect width="170" height="34" rx="8" class="badge-bg"/>
        <text x="85" y="21" fill="#e2e8f0" text-anchor="middle" class="tag">🔄 Fast Inner Loops</text>
      </g>
      <!-- Pill 5 -->
      <g transform="translate(653, 0)">
        <rect width="175" height="34" rx="8" class="badge-bg"/>
        <text x="87" y="21" fill="#e2e8f0" text-anchor="middle" class="tag">🛡️ Sandboxed Shells</text>
      </g>
    </g>
  </g>
</svg>
